<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cwkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#294B35" />
      <stop offset="100%" stop-color="#55765C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#cwkGrad)" />
  
  <!-- Outer warm accent circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#F3D9C8" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>

  <!-- Culinary Chef Cloche / Cooking Pot Icon -->
  <g transform="translate(106, 126)" filter="url(#shadow)">
    <!-- Steam waves -->
    <path d="M 80,40 Q 95,15 80,0" fill="none" stroke="#F3D9C8" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <path d="M 150,30 Q 165,5 150,-10" fill="none" stroke="#FAF8F2" stroke-width="8" stroke-linecap="round"/>
    <path d="M 220,40 Q 235,15 220,0" fill="none" stroke="#F3D9C8" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Lid handle -->
    <circle cx="150" cy="70" r="18" fill="#BD765B" />
    
    <!-- Cloche dome -->
    <path d="M 30,170 C 30,90 90,85 150,85 C 210,85 270,90 270,170 Z" fill="#FAF8F2" />
    
    <!-- Cloche rim -->
    <rect x="15" y="170" width="270" height="20" rx="10" fill="#BD765B" />
    
    <!-- Pot base -->
    <path d="M 40,205 L 55,245 C 60,258 75,268 95,268 L 205,268 C 225,268 240,258 245,245 L 260,205 Z" fill="#FAF8F2" opacity="0.95"/>
    
    <!-- Pot handles -->
    <path d="M 35,215 Q 10,225 35,235" fill="none" stroke="#BD765B" stroke-width="12" stroke-linecap="round"/>
    <path d="M 265,215 Q 290,225 265,235" fill="none" stroke="#BD765B" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
